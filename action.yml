name: context-gate
description: Measure what truncation deletes, before the model starts guessing.
branding:
  icon: shield
  color: blue
inputs:
  args:
    description: Arguments passed to gate.py
    required: false
    default: "--help"
runs:
  using: composite
  steps:
    - shell: bash
      run: python "${{ github.action_path }}/gate.py" ${{ inputs.args }}
